<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>papan catur</title>
    <style>
        body{
            display: grid;
            place-items: center; 
        }
        div.catur {
            width: 100%;
            max-width: 480px;    
            border: 4px solid black;
            display: grid;
            grid-template-columns: repeat(8, 1fr); 
            aspect-ratio: 1/1;
        }
        span{
            aspect-ratio: 1/1;
        }

        /*background Warna putih*/
        span.white {
            background-color: #ffffff;
        }
        /*background Warna Hitam*/
        span.black {
            background-color: #000000;
        }
    </style>
</head>
<body>
    <h1 class="center">PAPAN CATUR</h1>
    <div class="catur">
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>

        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>

        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>

        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>

        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>

        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
        <span class="black"></span>
        <span class="white"></span>
    </div>
</body>
</html>
