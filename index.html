<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>papan catur</title>
    <style>
        /* atur posisi konten */
        section{
            display: grid;
            place-items: center; 
        }
        /* atur papan catur */
        div.catur {
            width: 100%;
            max-width: 480px;  /*menentukan maksimal lebar papan catur*/  
            border: 4px solid black;
            display: grid;
            grid-template-columns: repeat(8, 1fr); 
            aspect-ratio: 1/1; /*supaya ukuran content 1 layar*/
        }

        /*background Warna putih pada child dari class catur dengan span urutan genap*/
        .catur > span:nth-child(even) {
            background-color: #ffffff;
        }
        /*background Warna hitam pada child dari class catur dengan span urutan ganjil*/
        .catur > span:nth-child(odd) {
            background-color: #000000;
        }

        /* kita balik warna khusus pada baris ganjil menjadi warna putih.*/
        .catur > span:nth-of-type(16n+9),
        .catur > span:nth-of-type(16n+11),
        .catur > span:nth-of-type(16n+13),
        .catur > span:nth-of-type(16n+15){
            background: #ffffff;
        }
        /* kita balik warna khusus pada baris genap menjadi warna hitam.*/
        .catur > span:nth-of-type(16n+10),
        .catur > span:nth-of-type(16n+12),
        .catur > span:nth-of-type(16n+14),
        .catur > span:nth-of-type(16n+16){
            background: #000000;
        }
    </style>
</head>
<body>
    <section>
        <h1>PAPAN CATUR</h1>
        <div class="catur">
